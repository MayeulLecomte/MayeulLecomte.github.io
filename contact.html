<style>
.contact-page{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-top:120px}
.contact-page .avatar{
  width:96px;height:96px;border-radius:50%;margin:0 auto 26px;overflow:hidden;
  background:linear-gradient(155deg,#dfe7ff,#f4e6ff);
  box-shadow:0 20px 40px -18px rgba(30,40,90,.4), inset 0 0 0 1px rgba(255,255,255,.7);
}
.contact-page .avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.mail-line{
  display:inline-flex;align-items:center;gap:12px;margin-top:30px;padding:18px 30px;border-radius:999px;
  background:rgba(255,255,255,.75);border:1px solid var(--line);
  font-size:clamp(1rem,3.4vw,1.35rem);font-weight:500;letter-spacing:-.02em;text-decoration:none;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:var(--shadow-soft);
  transition:transform .22s ease,background .25s ease;
}
.mail-line:hover{transform:translateY(-2px);background:#fff}
.insta{
  display:block;text-decoration:none;max-width:430px;margin:34px auto 0;padding:16px;
  border-radius:var(--r-lg);background:var(--glass);border:1px solid rgba(255,255,255,.75);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  box-shadow:var(--shadow-soft);text-align:left;
  transition:transform .32s cubic-bezier(.2,.7,.3,1),box-shadow .32s ease;
}
.insta:hover{transform:translateY(-4px);box-shadow:0 6px 16px rgba(0,0,0,.05),0 28px 52px -24px rgba(0,0,0,.3)}
.insta-head{display:flex;align-items:center;gap:13px}
.ring{
  width:52px;height:52px;border-radius:50%;flex:none;padding:2.5px;display:block;
  background:conic-gradient(from 210deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);
}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 16%;border:2.5px solid var(--bg)}
.who{display:flex;flex-direction:column;line-height:1.25;flex:1;min-width:0}
.who b{font-size:15.5px;font-weight:600;letter-spacing:-.02em}
.who i{font-style:normal;font-size:13px;color:var(--muted)}
.follow{
  flex:none;font-size:14px;font-weight:500;color:#fff;padding:8px 16px;border-radius:999px;
  background:linear-gradient(120deg,#d62976,#962fbf);
}
.insta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.insta-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:rgba(0,0,0,.05)}
.insta-grid:empty{display:none}
.back{display:inline-block;margin-top:44px;font-size:14.5px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
</style>
</head>

    <h2>Écrivez-moi</h2>
    <p>Un morceau à enregistrer, un projet à développer.</p>

    <div>
      <a class="mail-line reveal-mail" href="#"><span class="ico">✉️</span> <span class="lbl">Afficher mon email</span></a>
    </div>

    <a class="insta" id="insta" href="https://www.instagram.com/mayeul_lecomte/" target="_blank" rel="noopener">
      <div class="insta-head">
        <span class="ring"><img src="assets/mayeul.png" alt="" width="842" height="860"></span>
        <span class="who">
          <b>@mayeul_lecomte</b>
          <i>Instagram</i>
        </span>
        <span class="follow">Suivre</span>
      </div>
      <div class="insta-grid" id="instaGrid">
        <img src="assets/insta/1.jpg" alt="" loading="lazy">
        <img src="assets/insta/2.jpg" alt="" loading="lazy">
        <img src="assets/insta/3.jpg" alt="" loading="lazy">
      </div>
    </a>

    <div class="pills">
      <a class="pill" href="https://lmstudio-nantes.fr" target="_blank" rel="noopener">🎙 lmstudio-nantes.fr</a>

    </div>

  </section>
